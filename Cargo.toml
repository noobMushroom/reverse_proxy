[package]
name = "shiny_reverse_proxy"
version = "0.1.0"
edition = "2024"

[lib]
name = "proxy_library"
path="src/lib.rs"


[[bin]]
name = "proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0" , features = ["derive"]}
tokio = {version = "1.51.1", features = ["full"]}
reqwest = "0.13.2"
thiserror = "2.0.18"
dashmap = "6.1.0"
chrono = "0.4.44"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["json", "env-filter"]}
serde_json = "1.0.149"
url = "2.5.8"
bytes = "1.11.1"

[dev-dependencies]
predicates = "3.1.4"
assert_cmd = "2.2.0"

